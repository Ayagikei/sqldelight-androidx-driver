name: Publish a release

on:
  workflow_dispatch:

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

env:
  VERSION_FILE: gradle.properties
  VERSION_EXTRACT_PATTERN: '(?<=version=).+'
  GH_USER_NAME: github.actor
  GRADLE_OPTS: -Dkotlin.incremental=false -Dorg.gradle.jvmargs="-Xmx16g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m"

jobs:
  publish_artifacts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PUSH_PAT }}

      - name: Generate versions
        uses: HardNorth/github-version-generate@v1
        with:
          version-source: file
          version-file: ${{ env.VERSION_FILE }}
          version-file-extraction-pattern: ${{ env.VERSION_EXTRACT_PATTERN }}

      - name: Capture release source
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" != "branch" ]]; then
            echo "Release workflow must be dispatched from a branch" >&2
            exit 1
          fi

          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version-file: .ci-java-version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GIT_SIGNING_PRIVATE_KEY }}
          passphrase: ${{ secrets.GIT_SIGNING_PRIVATE_KEY_PASSWORD }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Create or verify release refs
        shell: bash
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          release_branch="releases/sync-v${RELEASE_VERSION}"
          release_tag="sync-v${RELEASE_VERSION}"
          release_branch_ref="refs/heads/${release_branch}"
          release_tag_ref="refs/tags/${release_tag}"

          remote_branch_sha="$(git ls-remote origin "${release_branch_ref}" | cut -f1)"
          if [[ -z "${remote_branch_sha}" ]]; then
            git push origin "${RELEASE_SHA}:${release_branch_ref}" || true
            remote_branch_sha="$(git ls-remote origin "${release_branch_ref}" | cut -f1)"
          fi
          if [[ "${remote_branch_sha}" != "${RELEASE_SHA}" ]]; then
            echo "Release branch points to ${remote_branch_sha:-<missing>}, expected ${RELEASE_SHA}" >&2
            exit 1
          fi

          remote_tag_object_sha="$(git ls-remote origin "${release_tag_ref}" | cut -f1)"
          if [[ -z "${remote_tag_object_sha}" ]]; then
            git tag --sign "${release_tag}" --message "Sync driver ${RELEASE_VERSION}" "${RELEASE_SHA}"
            git push origin "${release_tag_ref}" || true
          fi

          remote_tag_object_sha="$(git ls-remote origin "${release_tag_ref}" | cut -f1)"
          remote_tag_commit_sha="$(git ls-remote origin "${release_tag_ref}^{}" | cut -f1)"
          if [[ -z "${remote_tag_object_sha}" ]]; then
            echo "Release tag was not created" >&2
            exit 1
          fi
          if [[ -z "${remote_tag_commit_sha}" ]]; then
            echo "Release tag must be an annotated tag" >&2
            exit 1
          fi
          if [[ "${remote_tag_commit_sha}" != "${RELEASE_SHA}" ]]; then
            echo "Release tag points to ${remote_tag_commit_sha}, expected ${RELEASE_SHA}" >&2
            exit 1
          fi

          git fetch --force origin "+${release_tag_ref}:${release_tag_ref}"
          git verify-tag "${release_tag}"

      - name: Build changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: "changelog_config.json"
          toTag: sync-v${{ env.RELEASE_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find existing release
        id: find_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUSH_PAT }}
        run: |
          if gh release view "sync-v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create release
        id: create_release
        if: ${{ steps.find_release.outputs.exists != 'true' }}
        uses: ncipollo/release-action@v1
        with:
          body: ${{ steps.build_changelog.outputs.changelog }}
          name: Sync driver ${{ env.RELEASE_VERSION }}
          tag: sync-v${{ env.RELEASE_VERSION }}
          token: ${{ secrets.PUSH_PAT }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PUSH_PAT }}

      - name: Prepare next dev version
        id: prepare_next_dev
        shell: bash
        run: |
          sed -i -e "s/^version=${CURRENT_VERSION}$/version=${NEXT_VERSION}/" gradle.properties
          sed -i -E -e "s/sqldelight-androidx-driver-sync(:|\/)[0-9]+\.[0-9]+\.[0-9]+/sqldelight-androidx-driver-sync\1${RELEASE_VERSION}/g" README.md

          grep -Fqx "version=${NEXT_VERSION}" gradle.properties
          grep -Eq "sqldelight-androidx-driver-sync:[^\"]*${RELEASE_VERSION}" README.md

      - name: Commit next dev version
        id: commit_next_dev
        shell: bash
        run: |
          if git diff --quiet -- gradle.properties README.md; then
            echo "Next development version is already prepared"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties README.md
          git commit -m "Prepare next dev version"
          git push origin "HEAD:refs/heads/${{ github.ref_name }}"

      - name: Restore release source
        shell: bash
        run: git checkout --detach "${RELEASE_SHA}"

      - name: Publish the artifacts
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ARTIFACT_SIGNING_PRIVATE_KEY }}
        run: ./gradlew publishAllPublicationsToMavenCentralRepository -Pversion=${{ env.RELEASE_VERSION }}
